<script>
const SERVER_URL = window.location.origin;

let todosLosJuegos = [];
let socket = null;
let currentKey = "";
let juegoActual = null;
let filtroActual = "all";
let searchDebounceTimer = null;

/* ======================================================
   SETTINGS
====================================================== */

const DEFAULT_SETTINGS = {
    tracerOn: "on",
    tracerColor: "#ffffff",
    tracerSize: 6,
    explosionOn: "on",
    explosionColor: "#ffffff",
    explosionCount: 14,
    hudBg: "#0a0a14",
    hudOpacity: 60,
    bgColor: "#05050a",
    customCursor: "off",
    soundFx: "on",
    confetti: "on"
};

const PRESETS = {
    classic: { ...DEFAULT_SETTINGS },
    neon: {
        tracerColor: "#ff00ff", tracerSize: 8, explosionColor: "#00ffff", explosionCount: 20,
        hudBg: "#1a0033", hudOpacity: 70, bgColor: "#05050a"
    },
    cyberpunk: {
        tracerColor: "#fcee0a", tracerSize: 7, explosionColor: "#ff003c", explosionCount: 25,
        hudBg: "#0a0a1a", hudOpacity: 80, bgColor: "#0a0014"
    },
    matrix: {
        tracerColor: "#00ff41", tracerSize: 5, explosionColor: "#00ff41", explosionCount: 18,
        hudBg: "#001a00", hudOpacity: 65, bgColor: "#000a00"
    },
    minimal: {
        tracerOn: "off", explosionOn: "off", hudBg: "#000000", hudOpacity: 90,
        bgColor: "#000000", customCursor: "off"
    }
};

let userSettings = { ...DEFAULT_SETTINGS };

function cargarSettings() {
    try {
        const guardado = localStorage.getItem("omeles_settings");
        if (guardado) userSettings = { ...DEFAULT_SETTINGS, ...JSON.parse(guardado) };
    } catch {}
    aplicarSettings();
}

function aplicarSettings() {
    document.documentElement.style.setProperty("--tracer-color", userSettings.tracerColor);
    document.documentElement.style.setProperty("--tracer-size", userSettings.tracerSize + "px");
    document.documentElement.style.setProperty("--explosion-color", userSettings.explosionColor);

    const r = parseInt(userSettings.hudBg.slice(1, 3), 16);
    const g = parseInt(userSettings.hudBg.slice(3, 5), 16);
    const b = parseInt(userSettings.hudBg.slice(5, 7), 16);
    const op = userSettings.hudOpacity / 100;
    document.documentElement.style.setProperty("--hud-bg", `rgba(${r}, ${g}, ${b}, ${op})`);
    document.documentElement.style.setProperty("--bg", userSettings.bgColor);
    document.body.style.background = userSettings.bgColor;

    if (userSettings.customCursor === "on") {
        document.body.classList.add("custom-cursor");
    } else {
        document.body.classList.remove("custom-cursor");
    }
}

function guardarSettings() {
    userSettings.tracerOn = document.getElementById("setTracerOn").value;
    userSettings.tracerColor = document.getElementById("setTracerColor").value;
    userSettings.tracerSize = parseInt(document.getElementById("setTracerSize").value);
    userSettings.explosionOn = document.getElementById("setExplosionOn").value;
    userSettings.explosionColor = document.getElementById("setExplosionColor").value;
    userSettings.explosionCount = parseInt(document.getElementById("setExplosionCount").value);
    userSettings.hudBg = document.getElementById("setHudBg").value;
    userSettings.hudOpacity = parseInt(document.getElementById("setHudOpacity").value);
    userSettings.bgColor = document.getElementById("setBgColor").value;
    userSettings.customCursor = document.getElementById("setCustomCursor").value;
    userSettings.soundFx = document.getElementById("setSoundFx").value;
    userSettings.confetti = document.getElementById("setConfetti").value;

    localStorage.setItem("omeles_settings", JSON.stringify(userSettings));
    aplicarSettings();
    cerrarSettings();
    toast("Settings guardados", "success");
}

function resetSettings() {
    userSettings = { ...DEFAULT_SETTINGS };
    localStorage.setItem("omeles_settings", JSON.stringify(userSettings));
    cargarSettings();
    cargarValoresSettings();
    toast("Settings reseteados", "info");
}

function aplicarPreset(nombre) {
    userSettings = { ...DEFAULT_SETTINGS, ...PRESETS[nombre] };
    localStorage.setItem("omeles_settings", JSON.stringify(userSettings));
    aplicarSettings();
    cargarValoresSettings();
    toast(`Preset "${nombre}" aplicado`, "success");
}

function cargarValoresSettings() {
    document.getElementById("setTracerOn").value = userSettings.tracerOn;
    document.getElementById("setTracerColor").value = userSettings.tracerColor;
    document.getElementById("setTracerSize").value = userSettings.tracerSize;
    document.getElementById("setTracerSizeVal").textContent = userSettings.tracerSize + "px";
    document.getElementById("setExplosionOn").value = userSettings.explosionOn;
    document.getElementById("setExplosionColor").value = userSettings.explosionColor;
    document.getElementById("setExplosionCount").value = userSettings.explosionCount;
    document.getElementById("setExplosionCountVal").textContent = userSettings.explosionCount;
    document.getElementById("setHudBg").value = userSettings.hudBg;
    document.getElementById("setHudOpacity").value = userSettings.hudOpacity;
    document.getElementById("setHudOpacityVal").textContent = userSettings.hudOpacity + "%";
    document.getElementById("setBgColor").value = userSettings.bgColor;
    document.getElementById("setCustomCursor").value = userSettings.customCursor;
    document.getElementById("setSoundFx").value = userSettings.soundFx;
    document.getElementById("setConfetti").value = userSettings.confetti;
}

/* ======================================================
   TOASTS
====================================================== */

function toast(texto, tipo = "info", duracion = 3000) {
    const cont = document.getElementById("toastContainer");
    const el = document.createElement("div");
    el.className = "toast " + tipo;
    const icons = { success: "✅", error: "❌", info: "ℹ️", warning: "⚠️" };
    el.innerHTML = `<span>${icons[tipo] || "ℹ️"}</span> ${texto}`;
    cont.appendChild(el);
    requestAnimationFrame(() => el.classList.add("show"));
    setTimeout(() => {
        el.classList.remove("show");
        setTimeout(() => el.remove(), 400);
    }, duracion);
}

/* ======================================================
   SONIDOS
====================================================== */

let audioCtx = null;
function beep(freq, duration, volume = 0.08) {
    if (userSettings.soundFx !== "on") return;
    try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.frequency.value = freq;
        osc.type = "sine";
        gain.gain.setValueAtTime(volume, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
    } catch {}
}

function playClick() { beep(600, 0.05, 0.05); }
function playSuccess() { beep(880, 0.1); beep(1200, 0.1); }
function playError() { beep(200, 0.15, 0.1); }

/* ======================================================
   CONFETTI
====================================================== */

function lanzarConfetti(x, y) {
    if (userSettings.confetti !== "on") return;
    const colores = ["#8b5cff", "#2563eb", "#a855f7", "#ec4899", "#22c55e", "#fbbf24", "#ff1744"];
    for (let i = 0; i < 60; i++) {
        const c = document.createElement("div");
        c.className = "confetti";
        c.style.left = x + "px";
        c.style.top = y + "px";
        c.style.background = colores[Math.floor(Math.random() * colores.length)];
        c.style.borderRadius = Math.random() > 0.5 ? "50%" : "2px";
        document.body.appendChild(c);

        const angle = Math.random() * Math.PI * 2;
        const distance = 100 + Math.random() * 200;
        const dx = Math.cos(angle) * distance;
        const dy = Math.sin(angle) * distance - 100;

        requestAnimationFrame(() => {
            c.style.transition = "all 1.2s cubic-bezier(0.2, 0.8, 0.4, 1)";
            c.style.transform = `translate(${dx}px, ${dy}px) rotate(${Math.random() * 720}deg)`;
            c.style.opacity = "0";
        });

        setTimeout(() => c.remove(), 1300);
    }
}

/* ======================================================
   RIPPLE EFFECT
====================================================== */

document.addEventListener("click", (e) => {
    const btn = e.target.closest("button, .game-btn, .dropdown-item, .filter-btn");
    if (!btn) return;
    const rect = btn.getBoundingClientRect();
    const ripple = document.createElement("span");
    ripple.className = "ripple";
    const size = Math.max(rect.width, rect.height);
    ripple.style.width = ripple.style.height = size + "px";
    ripple.style.left = (e.clientX - rect.left - size / 2) + "px";
    ripple.style.top = (e.clientY - rect.top - size / 2) + "px";
    if (getComputedStyle(btn).position === "static") btn.style.position = "relative";
    btn.style.overflow = "hidden";
    btn.appendChild(ripple);
    setTimeout(() => ripple.remove(), 600);
});

/* ======================================================
   CURSOR PERSONALIZADO
====================================================== */

const customCursor = document.getElementById("customCursor");
document.addEventListener("mousemove", (e) => {
    customCursor.style.left = (e.clientX - 12) + "px";
    customCursor.style.top = (e.clientY - 12) + "px";
});

/* ======================================================
   OVERLAY DETECTION
====================================================== */

function hayOverlayAbierto() {
    const ids = ["aimOverlay", "calcOverlay", "cpsOverlay", "aiOverlay", "settingsOverlay", "gameModal"];
    return ids.some(id => document.getElementById(id)?.classList.contains("open"));
}

/* ======================================================
   PARTÍCULAS
====================================================== */

(function particulas() {
    let lastDotTime = 0;
    document.addEventListener("mousemove", (e) => {
        if (userSettings.tracerOn !== "on") return;
        if (hayOverlayAbierto() || !currentKey) return;
        const now = performance.now();
        if (now - lastDotTime < 40) return;
        lastDotTime = now;

        const size = userSettings.tracerSize;
        const color = userSettings.tracerColor;
        const dot = document.createElement("div");
        dot.style.cssText = `position:fixed;left:${e.clientX}px;top:${e.clientY}px;width:${size}px;height:${size}px;border-radius:50%;background:${color};box-shadow:0 0 ${size*2}px ${color},0 0 ${size*3}px ${color}80;pointer-events:none;z-index:9998;transform:translate(-50%,-50%);transition:all 0.6s ease-out;`;
        document.body.appendChild(dot);
        requestAnimationFrame(() => {
            dot.style.opacity = "0";
            dot.style.transform = "translate(-50%,-50%) scale(0.3) translateY(20px)";
        });
        setTimeout(() => dot.remove(), 650);
    });

    document.addEventListener("mousedown", (e) => {
        if (userSettings.explosionOn !== "on" || e.button !== 0) return;
        if (hayOverlayAbierto() || !currentKey) return;
        const total = userSettings.explosionCount;
        const color = userSettings.explosionColor;
        for (let i = 0; i < total; i++) {
            const dot = document.createElement("div");
            const angle = (Math.PI * 2 * i) / total;
            const distance = 60 + Math.random() * 50;
            const size = 3 + Math.random() * 4;
            dot.style.cssText = `position:fixed;left:${e.clientX}px;top:${e.clientY}px;width:${size}px;height:${size}px;border-radius:50%;background:${color};box-shadow:0 0 ${size*3}px ${color},0 0 ${size*4}px ${color}99;pointer-events:none;z-index:9999;transform:translate(-50%,-50%);transition:all 0.55s cubic-bezier(0.2,0.8,0.3,1);`;
            document.body.appendChild(dot);
            requestAnimationFrame(() => {
                dot.style.left = `${e.clientX + Math.cos(angle) * distance}px`;
                dot.style.top = `${e.clientY + Math.sin(angle) * distance}px`;
                dot.style.opacity = "0";
                dot.style.transform = "translate(-50%,-50%) scale(0.2)";
            });
            setTimeout(() => dot.remove(), 600);
        }
    });
})();

/* ======================================================
   FAVORITOS Y RECIENTES
====================================================== */

function getFavoritos() {
    try { return JSON.parse(localStorage.getItem("omeles_favs") || "[]"); } catch { return []; }
}

function setFavoritos(arr) {
    localStorage.setItem("omeles_favs", JSON.stringify(arr));
    actualizarContadores();
}

function esFavorito(nombre) { return getFavoritos().includes(nombre); }

function toggleFavorito(nombre, ev) {
    ev.stopPropagation();
    let favs = getFavoritos();
    if (favs.includes(nombre)) {
        favs = favs.filter(n => n !== nombre);
        toast("Eliminado de favoritos", "info", 1800);
    } else {
        favs.push(nombre);
        toast("Añadido a favoritos ⭐", "success", 1800);
    }
    setFavoritos(favs);
    filtrarJuegos();
}

function getRecientes() {
    try { return JSON.parse(localStorage.getItem("omeles_recent") || "[]"); } catch { return []; }
}

function addReciente(nombre) {
    let rec = getRecientes().filter(n => n !== nombre);
    rec.unshift(nombre);
    if (rec.length > 10) rec = rec.slice(0, 10);
    localStorage.setItem("omeles_recent", JSON.stringify(rec));
    actualizarContadores();
}

function actualizarContadores() {
    const elAll = document.getElementById("countAll");
    const elFav = document.getElementById("countFav");
    const elRec = document.getElementById("countRecent");
    if (elAll) elAll.textContent = todosLosJuegos.length;
    if (elFav) elFav.textContent = getFavoritos().length;
    if (elRec) elRec.textContent = getRecientes().length;
}

function setFilter(f) {
    filtroActual = f;
    document.querySelectorAll(".filter-btn").forEach(b => {
        b.classList.toggle("active", b.dataset.filter === f);
    });
    filtrarJuegos();
}

/* ======================================================
   MENÚ
====================================================== */

function toggleMenu() {
    document.getElementById("menuBtn").classList.toggle("active");
    document.getElementById("dropdown").classList.toggle("open");
    playClick();
}

document.addEventListener("click", (e) => {
    const menuBtn = document.getElementById("menuBtn");
    const dropdown = document.getElementById("dropdown");
    if (!menuBtn.contains(e.target) && !dropdown.contains(e.target)) {
        menuBtn.classList.remove("active");
        dropdown.classList.remove("open");
    }
});

/* ======================================================
   AIMLAB
====================================================== */

let aimActive = false;
let aimTimeLeft = 30;
let aimTimer = null;
let aimScore = 0;
let aimHits = 0;
let aimMiss = 0;
let aimConfig = {};
let aimTargetsOnScreen = [];
let aimMovementInterval = null;
let aimModoSeleccionado = "flick";

function setAimMode(modo) {
    aimModoSeleccionado = modo;
    document.querySelectorAll(".aim-mode-btn").forEach(b => {
        b.classList.toggle("active", b.dataset.mode === modo);
    });
    // Ajustes por modo
    const numEl = document.getElementById("cfgNumTargets");
    const sizeEl = document.getElementById("cfgSize");
    const movEl = document.getElementById("cfgMovement");
    const timeEl = document.getElementById("cfgTime");

    if (modo === "flick") { numEl.value = 1; sizeEl.value = 25; movEl.value = "static"; timeEl.value = 30; }
    if (modo === "precision") { numEl.value = 1; sizeEl.value = 12; movEl.value = "static"; timeEl.value = 60; }
    if (modo === "tracking") { numEl.value = 1; sizeEl.value = 30; movEl.value = "medium"; timeEl.value = 30; }
    if (modo === "speed") { numEl.value = 3; sizeEl.value = 20; movEl.value = "fast"; timeEl.value = 30; }

    document.getElementById("cfgNumTargetsVal").textContent = numEl.value;
    document.getElementById("cfgSizeVal").textContent = sizeEl.value;
    playClick();
}

function toggleAimTimeField() {
    const mode = document.getElementById("cfgMode").value;
    document.getElementById("aimTimeField").style.display = mode === "infinite" ? "none" : "flex";
}

function actualizarEstadisticasAim() {
    try {
        const stats = JSON.parse(localStorage.getItem("omeles_aim_stats") || '{"total":0,"best":0,"sum":0,"sumAcc":0}');
        document.getElementById("aimStatTotal").textContent = stats.total;
        document.getElementById("aimStatBest").textContent = stats.best;
        document.getElementById("aimStatAvg").textContent = stats.total > 0 ? Math.round(stats.sum / stats.total) : 0;
        document.getElementById("aimStatAcc").textContent = stats.total > 0 ? Math.round(stats.sumAcc / stats.total) + "%" : "0%";
    } catch {}
}

function guardarEstadisticaAim(score, acc) {
    try {
        const stats = JSON.parse(localStorage.getItem("omeles_aim_stats") || '{"total":0,"best":0,"sum":0,"sumAcc":0}');
        stats.total++;
        stats.sum += score;
        stats.sumAcc += acc;
        if (score > stats.best) stats.best = score;
        localStorage.setItem("omeles_aim_stats", JSON.stringify(stats));
        actualizarEstadisticasAim();
    } catch {}
}

function abrirAimLab() {
    document.getElementById("dropdown").classList.remove("open");
    document.getElementById("menuBtn").classList.remove("active");
    document.getElementById("aimOverlay").classList.add("open");
    document.body.style.overflow = "hidden";
    actualizarEstadisticasAim();
    volverConfigAim();
}

function cerrarAimLab() {
    document.getElementById("aimOverlay").classList.remove("open");
    document.body.style.overflow = "";
    detenerAimGame();
    limpiarTargets();
}

function volverConfigAim() {
    detenerAimGame();
    limpiarTargets();
    document.getElementById("aimConfigScreen").style.display = "flex";
    document.getElementById("aimResultScreen").style.display = "none";
    document.getElementById("aimHud").style.display = "none";
    document.getElementById("aimPlayArea").style.display = "none";
    actualizarEstadisticasAim();
}

function iniciarAimGame() {
    aimConfig = {
        numTargets: parseInt(document.getElementById("cfgNumTargets").value),
        size: parseInt(document.getElementById("cfgSize").value),
        shape: document.getElementById("cfgShape").value,
        movement: document.getElementById("cfgMovement").value,
        mode: document.getElementById("cfgMode").value,
        time: parseInt(document.getElementById("cfgTime").value) || 30,
        colorTarget: document.getElementById("cfgColorTarget").value,
        colorBg: document.getElementById("cfgColorBg").value,
        sound: document.getElementById("cfgSound").value,
        crosshair: document.getElementById("cfgCrosshair").value === "on"
    };

    aimScore = 0; aimHits = 0; aimMiss = 0; aimTimeLeft = aimConfig.time;

    document.getElementById("aimScore").textContent = "0";
    document.getElementById("aimHits").textContent = "0";
    document.getElementById("aimMiss").textContent = "0";
    document.getElementById("aimAcc").textContent = "100%";

    const timeEl = document.getElementById("aimTime");
    if (aimConfig.mode === "infinite") timeEl.textContent = "∞";
    else { timeEl.textContent = aimConfig.time; timeEl.classList.remove("red"); }

    document.getElementById("aimConfigScreen").style.display = "none";
    document.getElementById("aimResultScreen").style.display = "none";
    document.getElementById("aimHud").style.display = "flex";
    document.getElementById("aimPlayArea").style.display = "block";
    document.getElementById("aimPlayArea").style.background = aimConfig.colorBg;

    if (aimConfig.crosshair) {
        const cross = document.createElement("div");
        cross.id = "aimCrosshair";
        cross.style.cssText = "position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);pointer-events:none;z-index:5;";
        cross.innerHTML = `<div style="position:absolute;top:0;left:-10px;width:20px;height:2px;background:rgba(139,92,255,0.5);"></div><div style="position:absolute;top:-10px;left:0;width:2px;height:20px;background:rgba(139,92,255,0.5);"></div>`;
        document.getElementById("aimPlayArea").appendChild(cross);
    }

    aimActive = true;
    for (let i = 0; i < aimConfig.numTargets; i++) spawnTarget();

    if (aimConfig.movement !== "static") {
        const speed = { slow: 3000, medium: 1500, fast: 700 }[aimConfig.movement];
        aimMovementInterval = setInterval(() => {
            if (!aimActive) return;
            aimTargetsOnScreen.forEach(t => moverTarget(t));
        }, speed);
    }

    if (aimConfig.mode === "time") {
        aimTimer = setInterval(() => {
            aimTimeLeft--;
            timeEl.textContent = aimTimeLeft;
            if (aimTimeLeft <= 5) timeEl.classList.add("red");
            if (aimTimeLeft <= 0) terminarAimGame();
        }, 1000);
    }
}

function crearFormaTarget(size, color) {
    const baseStyle = `width:${size}px;height:${size}px;background:${color};box-shadow:0 0 25px ${color}cc;border:1px solid rgba(255,255,255,0.3);`;
    if (aimConfig.shape === "circle") return `border-radius:50%;${baseStyle}`;
    if (aimConfig.shape === "square") return `border-radius:8px;${baseStyle}`;
    if (aimConfig.shape === "triangle") return `border-radius:4px;clip-path:polygon(50% 0%, 100% 100%, 0% 100%);${baseStyle}`;
    if (aimConfig.shape === "cross") return `border-radius:4px;clip-path:polygon(35% 0%, 65% 0%, 65% 35%, 100% 35%, 100% 65%, 65% 65%, 65% 100%, 35% 100%, 35% 65%, 0% 65%, 0% 35%, 35% 35%);${baseStyle}`;
    return `border-radius:50%;${baseStyle}`;
}

function spawnTarget() {
    if (!aimActive) return;
    const area = document.getElementById("aimPlayArea");
    const rect = area.getBoundingClientRect();
    const size = aimConfig.size;
    const padding = size + 30;
    const x = padding + Math.random() * (rect.width - padding * 2);
    const y = 120 + Math.random() * (rect.height - 240);

    const target = document.createElement("div");
    target.className = "aim-target";
    target.style.cssText = `position:absolute;left:${x - size / 2}px;top:${y - size / 2}px;cursor:crosshair;` + crearFormaTarget(size, aimConfig.colorTarget);

    target.addEventListener("mousedown", (e) => {
        e.stopPropagation();
        if (!aimActive) return;
        aciertoTarget(target);
    });

    area.appendChild(target);
    aimTargetsOnScreen.push(target);
}

function moverTarget(target) {
    const area = document.getElementById("aimPlayArea");
    const rect = area.getBoundingClientRect();
    const size = aimConfig.size;
    const padding = size + 30;
    const x = padding + Math.random() * (rect.width - padding * 2);
    const y = 120 + Math.random() * (rect.height - 240);
    target.style.transition = "left 0.5s ease, top 0.5s ease";
    target.style.left = `${x - size / 2}px`;
    target.style.top = `${y - size / 2}px`;
}

function aciertoTarget(target) {
    target.classList.add("hit");
    aimHits++;
    aimScore += 100;
    if (aimConfig.sound === "on") beep(880, 0.05);
    document.getElementById("aimHits").textContent = aimHits;
    document.getElementById("aimScore").textContent = aimScore;
    actualizarPrecisionAim();
    const idx = aimTargetsOnScreen.indexOf(target);
    if (idx > -1) aimTargetsOnScreen.splice(idx, 1);
    setTimeout(() => {
        target.remove();
        if (aimActive) spawnTarget();
    }, 300);
}

function actualizarPrecisionAim() {
    const total = aimHits + aimMiss;
    const acc = total > 0 ? Math.round((aimHits / total) * 100) : 100;
    document.getElementById("aimAcc").textContent = acc + "%";
}

document.getElementById("aimPlayArea").addEventListener("mousedown", (e) => {
    if (!aimActive) return;
    if (e.target.closest(".aim-target")) return;
    aimMiss++;
    aimScore = Math.max(0, aimScore - 25);
    if (aimConfig.sound === "on") beep(220, 0.08);
    document.getElementById("aimMiss").textContent = aimMiss;
    document.getElementById("aimScore").textContent = aimScore;
    actualizarPrecisionAim();
});

function terminarAimGame() {
    detenerAimGame();
    limpiarTargets();
    const total = aimHits + aimMiss;
    const acc = total > 0 ? Math.round((aimHits / total) * 100) : 0;

    document.getElementById("resultScore").textContent = aimScore;
    document.getElementById("resultAcc").textContent = acc + "%";
    document.getElementById("resultHits").textContent = aimHits;
    document.getElementById("resultMiss").textContent = aimMiss;

    guardarEstadisticaAim(aimScore, acc);

    document.getElementById("aimHud").style.display = "none";
    document.getElementById("aimPlayArea").style.display = "none";
    document.getElementById("aimResultScreen").style.display = "flex";
}

function detenerAimGame() {
    aimActive = false;
    if (aimTimer) { clearInterval(aimTimer); aimTimer = null; }
    if (aimMovementInterval) { clearInterval(aimMovementInterval); aimMovementInterval = null; }
}

function limpiarTargets() {
    document.querySelectorAll(".aim-target").forEach(t => t.remove());
    aimTargetsOnScreen = [];
    const cross = document.getElementById("aimCrosshair");
    if (cross) cross.remove();
}

/* ======================================================
   CALCULADORA
====================================================== */

let calcCurrent = "";
let calcResultShown = false;
let calcScientific = false;
let calcHistoryArr = [];

function abrirCalculadora() {
    document.getElementById("dropdown").classList.remove("open");
    document.getElementById("menuBtn").classList.remove("active");
    document.getElementById("calcOverlay").classList.add("open");
    document.body.style.overflow = "hidden";
    calcClear();
    renderCalcHistory();
}

function cerrarCalculadora() {
    document.getElementById("calcOverlay").classList.remove("open");
    document.body.style.overflow = "";
}

function toggleCalcScientific() {
    calcScientific = !calcScientific;
    const grid = document.getElementById("calcGrid");
    // Insertar fila científica
    let sciRow = document.getElementById("calcSciRow");
    if (calcScientific && !sciRow) {
        sciRow = document.createElement("div");
        sciRow.id = "calcSciRow";
        sciRow.style.cssText = "display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:10px;";
        sciRow.innerHTML = `
            <button class="calc-btn sci" onclick="calcFunc('sqrt')">√</button>
            <button class="calc-btn sci" onclick="calcFunc('sq')">x²</button>
            <button class="calc-btn sci" onclick="calcFunc('pi')">π</button>
            <button class="calc-btn sci" onclick="calcFunc('pct')">%</button>
        `;
        grid.parentNode.insertBefore(sciRow, grid);
    } else if (!calcScientific && sciRow) {
        sciRow.remove();
    }
}

function calcNum(n) {
    const display = document.getElementById("calcDisplay");
    if (calcResultShown) { calcCurrent = ""; calcResultShown = false; }
    calcCurrent += n;
    display.textContent = calcCurrent;
}

function calcOp(op) {
    calcResultShown = false;
    calcCurrent += op;
    document.getElementById("calcDisplay").textContent = calcCurrent;
}

function calcFunc(fn) {
    try {
        let v = Function('"use strict"; return (' + (calcCurrent || "0") + ')')();
        if (fn === "sqrt") v = Math.sqrt(v);
        if (fn === "sq") v = v * v;
        if (fn === "pi") v = Math.PI;
        if (fn === "pct") v = v / 100;
        calcCurrent = String(v);
        document.getElementById("calcDisplay").textContent = calcCurrent;
        calcResultShown = true;
    } catch {
        document.getElementById("calcDisplay").textContent = "Error";
    }
}

function calcClear() {
    calcCurrent = "";
    calcResultShown = false;
    document.getElementById("calcDisplay").textContent = "0";
}

function calcEqual() {
    const display = document.getElementById("calcDisplay");
    const expr = calcCurrent;
    try {
        if (!/^[0-9+\-*/().\s]+$/.test(expr)) throw new Error();
        const result = Function('"use strict"; return (' + expr + ')')();
        calcHistoryArr.unshift(`${expr} = ${result}`);
        if (calcHistoryArr.length > 10) calcHistoryArr = calcHistoryArr.slice(0, 10);
        localStorage.setItem("omeles_calc_history", JSON.stringify(calcHistoryArr));
        renderCalcHistory();
        calcCurrent = String(result);
        display.textContent = calcCurrent;
        calcResultShown = true;
    } catch {
        display.textContent = "Error";
        calcCurrent = "";
        calcResultShown = true;
    }
}

function renderCalcHistory() {
    try { calcHistoryArr = JSON.parse(localStorage.getItem("omeles_calc_history") || "[]"); } catch {}
    const el = document.getElementById("calcHistory");
    if (calcHistoryArr.length === 0) { el.classList.remove("show"); return; }
    el.classList.add("show");
    el.innerHTML = calcHistoryArr.map(h => `<div class="calc-history-line">${h}</div>`).join("");
}

let cpsActive = false;
let cpsCount = 0;
let cpsTimeLeft = 5;
let cpsTimer = null;
let cpsDuration = 5;
let cpsHistory = [];

function abrirCPS() {
    document.getElementById("dropdown").classList.remove("open");
    document.getElementById("menuBtn").classList.remove("active");

    document.getElementById("cpsOverlay").classList.remove("open");

    cpsActive = false;

function cpsPresetChange() {
    const val = document.getElementById("cpsPreset").value;
    const custom = document.getElementById("cpsCustom");
    if (val === "custom") {
        custom.style.display = "block";
        custom.value = cpsDuration;
    } else {
        custom.style.display = "none";
        cpsDuration = parseInt(val);
    }
    resetCPS();
}

document.getElementById("cpsCustom")?.addEventListener("input", () => {
    const v = parseInt(document.getElementById("cpsCustom").value);
    if (v >= 1 && v <= 999) { cpsDuration = v; resetCPS(); }
});

function resetCPS() {
    if (cpsTimer) { clearInterval(cpsTimer); cpsTimer = null; }
    cpsActive = false;
    cpsCount = 0;
    cpsTimeLeft = cpsDuration;
    document.getElementById("cpsValue").textContent = "0";
    document.getElementById("cpsClicks").textContent = "0";
    document.getElementById("cpsTime").textContent = cpsDuration + "s";
    document.getElementById("cpsTimerFill").style.width = "100%";
    document.getElementById("cpsTimerFill").style.transition = "none";
    document.getElementById("cpsClickArea").innerHTML = `HAZ CLIC AQUÍ<div class="cps-click-sub">o pulsa la barra espaciadora</div>`;
}

function doCpsClick() {
    if (!cpsActive) {
        cpsActive = true;
        cpsCount = 0;
        cpsTimeLeft = cpsDuration;
        document.getElementById("cpsClickArea").innerHTML = `¡CLICK RÁPIDO!<div class="cps-click-sub">¡Sigue así!</div>`;
        document.getElementById("cpsTimerFill").style.transition = "width 0.1s linear";

        cpsTimer = setInterval(() => {
            cpsTimeLeft--;
            document.getElementById("cpsTime").textContent = cpsTimeLeft + "s";
            document.getElementById("cpsTimerFill").style.width = (cpsTimeLeft / cpsDuration * 100) + "%";
            if (cpsTimeLeft <= 0) {
                clearInterval(cpsTimer);
                cpsTimer = null;
                cpsActive = false;
                const elapsed = cpsDuration;
                const finalCps = (cpsCount / elapsed).toFixed(2);
                cpsHistory.unshift({ cps: finalCps, clicks: cpsCount, duration: cpsDuration, fecha: new Date().toLocaleTimeString() });
                if (cpsHistory.length > 5) cpsHistory = cpsHistory.slice(0, 5);
                localStorage.setItem("omeles_cps_history", JSON.stringify(cpsHistory));
                renderCpsHistory();
                document.getElementById("cpsClickArea").innerHTML = `TERMINADO ✓<div class="cps-click-sub">CPS: ${finalCps}</div>`;
                toast(`¡${finalCps} CPS!`, "success");
            }
        }, 1000);
    }

    if (!cpsActive) return;
    cpsCount++;
    beep(1000 + Math.random() * 200, 0.03, 0.03);
    const elapsed = cpsDuration - cpsTimeLeft;
    const cps = elapsed > 0 ? (cpsCount / elapsed).toFixed(2) : cpsCount.toFixed(2);
    document.getElementById("cpsClicks").textContent = cpsCount;
    document.getElementById("cpsValue").textContent = cps;
}

document.getElementById("cpsClickArea").addEventListener("mousedown", doCpsClick);

// Soporte barra espaciadora dentro del overlay CPS
document.addEventListener("keydown", (e) => {
    if (e.key === " " && document.getElementById("cpsOverlay").classList.contains("open")) {
        e.preventDefault();
        doCpsClick();
    }
});

function renderCpsHistory() {
    try { cpsHistory = JSON.parse(localStorage.getItem("omeles_cps_history") || "[]"); } catch {}
    const el = document.getElementById("cpsHistoryList");
    if (cpsHistory.length === 0) {
        el.innerHTML = '<div style="color:#666;font-size:11px;">Sin partidas aún</div>';
        return;
    }
    el.innerHTML = cpsHistory.map((h, i) => `<div style="padding:3px 0;">#${i + 1} · <b style="color:#22c55e">${h.cps} CPS</b> · ${h.clicks} clics · ${h.duration}s</div>`).join("");
}

function buscarJuego(texto) {
    const t = texto.toLowerCase();
    return todosLosJuegos.find(g => {
        const n = String(g.name).toLowerCase();
        return t.includes(n) || n.includes(t);
    });
}

function obtenerRespuestaIA(texto) {
    const t = texto.toLowerCase().trim();

    if (t.includes("cuantos juegos") || t.includes("cuántos juegos") || t.includes("numero de juegos") || t.includes("número de juegos") || t.includes("total de juegos")) {
        return todosLosJuegos.length === 0 ? "No hay juegos aún." : `📊 Hay **${todosLosJuegos.length}** juego${todosLosJuegos.length === 1 ? '' : 's'} en el catálogo.`;
    }

    if (t.includes("lista de juegos") || t.includes("listar juegos") || t.includes("que juegos") || t.includes("qué juegos") || t.includes("muestra los juegos") || t.includes("ver juegos")) {
        if (todosLosJuegos.length === 0) return "No hay juegos.";
        return `📋 Juegos (${todosLosJuegos.length}):\n${todosLosJuegos.map((g, i) => `${i + 1}. ${g.name}`).join("\n")}`;
    }

    const juegoEncontrado = buscarJuego(t);
    if (juegoEncontrado) {
        const j = juegoEncontrado;
        let resp = `🎮 **${j.name}**\n\n⬇️ Descarga: ${j.download ? "✅" : "❌"}\n🔧 Reparación: ${j.repair ? "✅" : "❌"}\n🔑 Password: ${j.password ? "✅" : "❌"}`;
        if (j.password) resp += `\n\nContraseña: ${j.password}`;
        return resp;
    }

    for (const item of iaRespuestas) {
        for (const trigger of item.triggers) {
            if (t.includes(trigger)) {
                if (item.respuesta === "GENERAR_CONTEO_JUEGOS") return `Hay ${todosLosJuegos.length} juegos.`;
                if (item.respuesta === "GENERAR_LISTA_JUEGOS") return todosLosJuegos.map(g => "• " + g.name).join("\n");
                if (item.respuesta === "HORA_ACTUAL") return "Son las " + new Date().toLocaleTimeString('es-ES') + " ⏰";
                if (item.respuesta === "FECHA_ACTUAL") return "Hoy es " + new Date().toLocaleDateString('es-ES', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' }) + " 📅";
                return item.respuesta;
            }
        }
    }

    if (t.includes("info") || t.includes("datos") || t.includes("hablame de") || t.includes("cuentame de")) {
        const palabras = t.replace(/info|datos|de|hablame|cuentame|dime|sobre/g, "").trim();
        if (palabras) {
            const j = buscarJuego(palabras);
            if (j) return `🎮 **${j.name}**\n\n⬇️ ${j.download ? "Disponible" : "No"}\n🔧 ${j.repair ? "Disponible" : "No"}\n🔑 ${j.password || "No"}`;
        }
    }

    if (t.includes("?")) return "Prueba a preguntar por un juego específico o escribe 'ayuda' 🤔";
    if (t.split(" ").length <= 2) return "Entiendo. ¿Puedes contarme más? 🤔";
    return "No tengo esa info. Prueba con un juego específico o 'ayuda' 💬";
}

async function iniciarSesion() {
    const input = document.getElementById("keyInput");
    const message = document.getElementById("loginMessage");
    const key = input.value.trim();

    if (!key) { message.textContent = "Introduce una KEY."; return; }

    message.textContent = "Comprobando KEY...";

    try {
        const r = await fetch(`${SERVER_URL}/api/login`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ key })
        });
        const d = await r.json();

        if (!r.ok) {
            message.textContent = d.message || d.error || "KEY incorrecta.";
            playError();
            return;
        }

        localStorage.setItem("omeles_key", key);
        currentKey = key;
        playSuccess();
        toast("¡Bienvenido!", "success");
        mostrarCliente();
        conectarSocket();

    } catch (e) {
        console.error(e);
        message.textContent = "No se pudo conectar con el servidor.";
    }
}

/* ======================================================
   SOCKET
====================================================== */

function conectarSocket() {
    if (socket) { socket.disconnect(); socket = null; }
    socket = io({ auth: { key: currentKey } });

    socket.on("key-revoked", (d) => {
        if (d.key === currentKey) {
            alert("⚠️ Tu KEY ha sido revocada.\n\nSerás expulsado.");
            cerrarSesion();
        }
    });

    socket.on("games-updated", () => cargarJuegos());
}

function mostrarCliente() {
    document.getElementById("loginScreen").style.display = "none";
    document.getElementById("clientScreen").style.display = "block";
    cargarJuegos();
}

function cerrarSesion() {
    localStorage.removeItem("omeles_key");
    currentKey = "";
    if (socket) { socket.disconnect(); socket = null; }
    document.getElementById("clientScreen").style.display = "none";
    document.getElementById("loginScreen").style.display = "flex";
    document.getElementById("keyInput").value = "";
    document.getElementById("loginMessage").textContent = "";
}

function escapeHTML(v) {
    return String(v ?? "")
        .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;").replace(/'/g, "&#039;");
}

async function cargarJuegos() {
    const contenedor = document.getElementById("games");
    contenedor.innerHTML = `<div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>`;

    try {
        const r = await fetch(`${SERVER_URL}/api/games`);
        if (!r.ok) throw new Error("Error");
        const d = await r.json();
        if (!d.success) throw new Error(d.message || "Error");

        todosLosJuegos = Array.isArray(d.games) ? d.games : [];
        actualizarContadores();
        filtrarJuegos();

    } catch (e) {
        console.error("ERROR:", e);
        contenedor.innerHTML = `<div class="empty"><div class="empty-icon">😢</div>No se pudieron cargar los juegos.</div>`;
    }
}

function onSearchInput() {
    clearTimeout(searchDebounceTimer);
    searchDebounceTimer = setTimeout(filtrarJuegos, 200);
}

function filtrarJuegos() {
    const input = document.getElementById("searchInput");
    const texto = input ? input.value.toLowerCase().trim() : "";

    let filtrados = todosLosJuegos;

    // Aplicar filtro
    if (filtroActual === "favorites") {
        const favs = getFavoritos();
        filtrados = filtrados.filter(j => favs.includes(j.name));
    } else if (filtroActual === "recent") {
        const rec = getRecientes();
        filtrados = filtrados.filter(j => rec.includes(j.name));
        filtrados.sort((a, b) => rec.indexOf(a.name) - rec.indexOf(b.name));
    }

    // Aplicar búsqueda
    if (texto) {
        filtrados = filtrados.filter(j =>
            String(j.name || "").toLowerCase().includes(texto)
        );
    }

    renderJuegos(filtrados);
}

function renderJuegos(juegos) {
    const contenedor = document.getElementById("games");
    contenedor.innerHTML = "";

    if (!juegos || juegos.length === 0) {
        const texto = document.getElementById("searchInput")?.value.trim();
        let msg = "No hay juegos disponibles todavía.";
        if (texto) msg = "No se encontraron juegos con ese nombre.";
        else if (filtroActual === "favorites") msg = "No tienes favoritos todavía.";
        else if (filtroActual === "recent") msg = "Aún no has abierto ningún juego.";
        contenedor.innerHTML = `<div class="empty"><div class="empty-icon">${filtroActual === "favorites" ? "⭐" : filtroActual === "recent" ? "🕒" : "🎮"}</div>${msg}</div>`;
        return;
    }

    juegos.forEach((juego, i) => {
        const tarjeta = document.createElement("div");
        tarjeta.className = "game-card";
        tarjeta.style.transitionDelay = (i * 30) + "ms";

        const nombre = escapeHTML(juego.name);
        const imagen = escapeHTML(juego.image || "");
        const esFav = esFavorito(juego.name);

        const iconoHTML = imagen
            ? `<div class="game-icon has-image"><img src="${imagen}" alt="${nombre}" loading="lazy" onerror="this.parentElement.classList.remove('has-image'); this.parentElement.innerHTML='🎮';"></div>`
            : `<div class="game-icon">🎮</div>`;

        tarjeta.innerHTML = `
            <button class="fav-btn ${esFav ? "active" : ""}" onclick="toggleFavorito('${nombre.replace(/'/g, "\\'")}', event)" title="Favorito">${esFav ? "★" : "☆"}</button>
            <button class="game-header" type="button">
                <div class="game-left">
                    ${iconoHTML}
                    <div style="min-width:0;">
                        <div class="game-name">${nombre}</div>
                        <div class="game-status">Juego disponible</div>
                    </div>
                </div>
                <div class="game-arrow">›</div>
            </button>
        `;

        tarjeta.addEventListener("click", () => abrirModal(juego));
        contenedor.appendChild(tarjeta);

        // Animación de aparición
        requestAnimationFrame(() => {
            setTimeout(() => tarjeta.classList.add("visible"), 30);
        });
    });
}

        a.className = "game-btn repair";
        a.innerHTML = `<div class="game-btn-icon">🔧</div><div class="game-btn-text"><span class="game-btn-title">REPARACIÓN</span><span class="game-btn-subtitle">Solucionar errores</span></div>`;
        a.onclick = () => playClick();
        c.appendChild(a);
    }

    if (password) {
        const btn = document.createElement("button");
        btn.className = "game-btn password";
        btn.innerHTML = `<div class="game-btn-icon">🔑</div><div class="game-btn-text"><span class="game-btn-title">CONTRASEÑA</span><span class="game-btn-subtitle">Copiar al portapapeles</span></div>`;
        btn.addEventListener("click", (e) => copiarPassword(password, e));
        c.appendChild(btn);
    }

    if (!download && !repair && !password) {
        c.innerHTML = `<div style="text-align:center;color:#666;padding:20px;font-size:13px;">Este juego no tiene opciones disponibles todavía.</div>`;
    }

    document.getElementById("gameModal").classList.add("open");
    document.body.style.overflow = "hidden";
}

function cerrarModal() {
    document.getElementById("gameModal").classList.remove("open");
    document.body.style.overflow = "";
    juegoActual = null;
}

document.getElementById("gameModal").addEventListener("click", (e) => {
    if (e.target.id === "gameModal") cerrarModal();
});

document.addEventListener("keydown", (e) => {
    if (e.key === "Escape") {
        ["gameModal", "aimOverlay", "calcOverlay", "cpsOverlay", "aiOverlay", "settingsOverlay"].forEach(id => {
            const el = document.getElementById(id);
            if (el?.classList.contains("open")) {
                if (id === "gameModal") cerrarModal();
                if (id === "aimOverlay") cerrarAimLab();
                if (id === "calcOverlay") cerrarCalculadora();
                if (id === "cpsOverlay") cerrarCPS();
                if (id === "aiOverlay") cerrarIA();
                if (id === "settingsOverlay") cerrarSettings();
            }
        });
        document.getElementById("dropdown").classList.remove("open");
        document.getElementById("menuBtn").classList.remove("active");
    }

    // Ctrl+K → buscar
    if ((e.ctrlKey || e.metaKey) && e.key === "k") {
        e.preventDefault();
        document.getElementById("searchInput")?.focus();
    }

    // F → favoritos
    if (e.key === "f" && !e.ctrlKey && !e.metaKey && document.activeElement.tagName !== "INPUT" && document.activeElement.tagName !== "TEXTAREA") {
        if (!hayOverlayAbierto()) {
            setFilter(filtroActual === "favorites" ? "all" : "favorites");
        }
    }

    // / → focus search
    if (e.key === "/" && document.activeElement.tagName !== "INPUT" && document.activeElement.tagName !== "TEXTAREA") {
        e.preventDefault();
        document.getElementById("searchInput")?.focus();
    }
});

// Ocultar shortcut cuando hay foco
document.getElementById("searchInput")?.addEventListener("focus", () => {
    document.getElementById("searchShortcut").classList.add("hidden");
});
document.getElementById("searchInput")?.addEventListener("blur", () => {
    document.getElementById("searchShortcut").classList.remove("hidden");
});

/* ======================================================
   COPIAR PASSWORD
====================================================== */

async function copiarPassword(password, ev) {
    try {
        await navigator.clipboard.writeText(password);
    } catch {
        const ta = document.createElement("textarea");
        ta.value = password;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand("copy");
        document.body.removeChild(ta);
    }

    playSuccess();
    toast("✅ Contraseña copiada", "success", 2000);

    // Confetti
    if (ev) {
        lanzarConfetti(ev.clientX, ev.clientY);
    } else {
        lanzarConfetti(window.innerWidth / 2, window.innerHeight / 2);
    }
}

/* ======================================================
   ENTER LOGIN
====================================================== */

document.getElementById("keyInput").addEventListener("keydown", (e) => {
    if (e.key === "Enter") iniciarSesion();
});

/* ======================================================
   INIT
====================================================== */

window.addEventListener("DOMContentLoaded", () => {
    cargarSettings();

    // Ocultar loading screen
    setTimeout(() => {
        document.getElementById("loadingScreen").classList.add("hidden");
    }, 1200);

    const key = localStorage.getItem("omeles_key");
    if (key) {
        fetch("/api/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ key })
        })
        .then(async r => {
            if (!r.ok) { localStorage.removeItem("omeles_key"); return; }
            currentKey = key;
            mostrarCliente();
            conectarSocket();
        })
        .catch(e => console.error(e));
    }
});

// Intersection Observer para animaciones
const observer = new IntersectionObserver((entries) => {
    entries.forEach(e => {
        if (e.isIntersecting) e.target.classList.add("visible");
    });
}, { threshold: 0.1 });
