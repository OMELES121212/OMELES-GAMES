<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OMELES GAMES</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',Arial,sans-serif}
:root{--purple:#8b5cff;--blue:#2563eb;--bg:#05050a;--hud-bg:rgba(10,10,20,.6);--accent:#a855f7}
body{min-height:100vh;background:var(--bg);color:#fff;overflow-x:hidden;--tracer-size:6px;--tracer-color:#fff;--explosion-color:#fff}
#loading{position:fixed;inset:0;background:var(--bg);z-index:99998;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:25px;transition:.6s}
#loading.hide{opacity:0;visibility:hidden}
.ld-logo{font-size:42px;font-weight:900;letter-spacing:4px;background:linear-gradient(90deg,#fff,#b99cff,#60a5fa,#fff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-size:300% auto;animation:shine 2s linear infinite}
.ld-bar{width:240px;height:4px;background:rgba(255,255,255,.08);border-radius:4px;overflow:hidden}
.ld-bar>div{height:100%;background:linear-gradient(90deg,#6d28d9,#2563eb);animation:load 1.4s ease forwards;border-radius:4px}
.ld-text{font-size:11px;color:#666;letter-spacing:3px;text-transform:uppercase;animation:pulseTxt 1.4s infinite}
@keyframes load{to{width:100%}}@keyframes pulseTxt{0%,100%{opacity:.4}50%{opacity:1}}@keyframes shine{0%{background-position:0% 50%}100%{background-position:200% 50%}}
.orb{position:fixed;border-radius:50%;filter:blur(90px);opacity:.5;pointer-events:none;z-index:0;animation:float 20s infinite ease-in-out}
.o1{width:400px;height:400px;background:radial-gradient(circle,#8b5cff,transparent 70%);top:-100px;right:-100px}
.o2{width:500px;height:500px;background:radial-gradient(circle,#2563eb,transparent 70%);bottom:-150px;left:-150px;animation-delay:-7s}
.o3{width:350px;height:350px;background:radial-gradient(circle,#a855f7,transparent 70%);top:40%;left:45%;opacity:.25;animation-delay:-14s}
@keyframes float{0%,100%{transform:translate(0,0) scale(1)}33%{transform:translate(50px,-80px) scale(1.1)}66%{transform:translate(-50px,50px) scale(.9)}}
.grid-bg{position:fixed;inset:0;background-image:linear-gradient(rgba(139,92,255,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(139,92,255,.03) 1px,transparent 1px);background-size:50px 50px;pointer-events:none;z-index:1}
#loginScreen,#clientScreen,.tool-overlay,.game-modal,.palette-overlay,.ctx-menu,.ach-toast{position:relative;z-index:2}
body.zen .orb,body.zen .grid-bg{opacity:0;visibility:hidden;transition:.4s}
body.zen header .session-timer,body.zen header .status{opacity:0;visibility:hidden}
body.zen footer{opacity:.3}
body.zen .hero h1{font-size:32px;transition:.4s}
body.zen .hero p{opacity:0;height:0;margin:0;overflow:hidden;transition:.4s}
body.zen .filters,body.zen .search-w{opacity:.35;transition:.4s}
body.zen .filters:hover,body.zen .search-w:hover{opacity:1}
body.zen .g-card{background:rgba(12,12,22,.95);border-color:rgba(139,92,255,.08)}
body.zen #menuBtn{opacity:.4;transition:.4s}
body.zen #menuBtn:hover{opacity:1;transform:scale(1.08)}
#loginScreen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.login-box{width:100%;max-width:440px;padding:45px 40px;border-radius:24px;background:linear-gradient(145deg,rgba(25,25,40,.85),rgba(10,10,20,.9));backdrop-filter:blur(20px);border:1px solid rgba(139,92,255,.25);box-shadow:0 30px 90px rgba(0,0,0,.6),0 0 80px rgba(139,92,255,.15);text-align:center;position:relative;animation:loginFade .6s ease}
@keyframes loginFade{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
.login-box::before{content:"";position:absolute;inset:-2px;border-radius:26px;background:linear-gradient(135deg,#8b5cff,#2563eb,#8b5cff);background-size:200% 200%;animation:shine 4s linear infinite;z-index:-1;opacity:.4;filter:blur(12px)}
.login-logo{font-size:34px;font-weight:900;letter-spacing:3px;margin-bottom:10px;background:linear-gradient(90deg,#fff,#b99cff,#fff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-size:200% auto;animation:shine 3s linear infinite}
.login-logo span{color:#8b5cff;-webkit-text-fill-color:#8b5cff}
.login-sub{color:#888;font-size:14px;margin-bottom:35px}
.key-input{width:100%;padding:16px;border-radius:12px;border:1px solid rgba(255,255,255,.1);background:rgba(0,0,0,.4);color:#fff;outline:none;text-align:center;font-size:14px;letter-spacing:1.5px;margin-bottom:14px;transition:.3s}
.key-input:focus{border-color:#8b5cff;box-shadow:0 0 25px rgba(139,92,255,.3)}
.login-btn{width:100%;padding:15px;border:none;border-radius:12px;background:linear-gradient(90deg,#6d28d9,#2563eb);color:#fff;font-weight:900;letter-spacing:2px;cursor:pointer;transition:.4s;box-shadow:0 8px 25px rgba(109,40,217,.4)}
.login-btn:hover{transform:translateY(-2px);box-shadow:0 12px 35px rgba(109,40,217,.6)}
.login-btn:disabled{opacity:.6;cursor:not-allowed}
#loginMessage{min-height:20px;margin-top:15px;font-size:13px;color:#ff5c5c}
.login-hint{margin-top:20px;font-size:11px;color:#555}
#clientScreen{display:none;min-height:100vh}
header{height:80px;display:flex;align-items:center;justify-content:space-between;padding:0 40px;border-bottom:1px solid rgba(255,255,255,.06);background:var(--hud-bg);backdrop-filter:blur(20px);position:sticky;top:0;z-index:100;transition:.3s}
.logo{font-size:26px;font-weight:900;letter-spacing:2px}
.logo span{color:#8b5cff}
.h-right{display:flex;align-items:center;gap:15px}
.session-timer{font-size:11px;color:#666;padding:6px 10px;border-radius:8px;background:rgba(255,255,255,.03);font-variant-numeric:tabular-nums}
.status{display:flex;align-items:center;gap:8px;font-size:13px;color:#aaa;padding:6px 12px;border-radius:20px;background:rgba(0,255,136,.05);border:1px solid rgba(0,255,136,.15)}
.dot{width:8px;height:8px;border-radius:50%;background:#00ff88;box-shadow:0 0 10px #00ff88;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
.logout{border:none;background:rgba(255,255,255,.05);color:#aaa;padding:8px 16px;border-radius:10px;cursor:pointer;font-size:12px;font-weight:700;letter-spacing:1px}
.logout:hover{background:rgba(255,50,80,.15);color:#ff5672}
main{max-width:1100px;margin:auto;padding:50px 25px}
.hero{text-align:center;margin-bottom:25px}
.hero h1{font-size:52px;font-weight:900;margin-bottom:12px;background:linear-gradient(90deg,#fff,#b99cff,#60a5fa,#fff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-size:300% auto;animation:shine 5s linear infinite}
.hero p{color:#888;font-size:15px}
.view-switch{display:flex;gap:4px;justify-content:center;margin-bottom:18px;background:rgba(20,20,35,.5);padding:5px;border-radius:14px;width:fit-content;margin-left:auto;margin-right:auto;border:1px solid rgba(139,92,255,.15)}
.view-switch button{background:transparent;border:none;color:#888;padding:8px 16px;border-radius:10px;cursor:pointer;font-size:12px;font-weight:700;transition:.2s;letter-spacing:.5px}
.view-switch button.active{background:linear-gradient(135deg,#6d28d9,#2563eb);color:#fff;box-shadow:0 4px 15px rgba(109,40,217,.4)}
.view-switch button:hover:not(.active){color:#fff}
.filters{display:flex;gap:10px;justify-content:center;margin-bottom:20px;flex-wrap:wrap}
.f-btn{padding:8px 18px;border-radius:20px;border:1px solid rgba(139,92,255,.2);background:rgba(20,20,35,.5);color:#aaa;font-size:13px;font-weight:600;cursor:pointer;transition:.2s;display:flex;align-items:center;gap:6px}
.f-btn:hover{border-color:rgba(139,92,255,.5);color:#fff}
.f-btn.active{background:linear-gradient(135deg,#6d28d9,#2563eb);border-color:transparent;color:#fff;box-shadow:0 5px 20px rgba(109,40,217,.4)}
.f-count{background:rgba(0,0,0,.3);padding:1px 8px;border-radius:10px;font-size:11px}
.search-w{margin-bottom:25px;position:relative}
.search-w::before{content:"🔍";position:absolute;left:20px;top:50%;transform:translateY(-50%);font-size:18px;opacity:.5;pointer-events:none}
.search-input{width:100%;padding:18px 100px 18px 55px;border-radius:16px;border:1px solid rgba(139,92,255,.2);background:rgba(20,20,35,.6);color:#fff;outline:none;font-size:15px;transition:.3s}
.search-input:focus{border-color:#8b5cff;box-shadow:0 0 30px rgba(139,92,255,.25)}
.sc-key{position:absolute;right:18px;top:50%;transform:translateY(-50%);background:rgba(139,92,255,.15);border:1px solid rgba(139,92,255,.3);color:#b99cff;padding:3px 8px;border-radius:6px;font-size:11px;font-weight:700;pointer-events:none}
.sc-key.hide{display:none}
.games{display:grid;grid-template-columns:1fr;gap:16px;transition:.3s}
.games.view-grid{grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
.games.view-compact{grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px}
.g-card{background:linear-gradient(145deg,rgba(25,25,40,.7),rgba(12,12,22,.85));backdrop-filter:blur(15px);border:1px solid rgba(139,92,255,.15);border-radius:18px;overflow:hidden;cursor:pointer;transition:.35s cubic-bezier(.4,0,.2,1);position:relative;opacity:0;transform:translateY(20px)}
.g-card.vis{opacity:1;transform:translateY(0)}
.g-card:hover{border-color:rgba(139,92,255,.5);transform:translateY(-4px);box-shadow:0 20px 50px rgba(0,0,0,.4),0 0 40px rgba(139,92,255,.15)}
.g-header{width:100%;padding:20px 22px;display:flex;align-items:center;justify-content:space-between;background:transparent;color:#fff;border:none;cursor:pointer;text-align:left}
.g-left{display:flex;align-items:center;gap:16px;flex:1;min-width:0}
.g-icon{width:58px;height:58px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:26px;background:linear-gradient(135deg,#6d28d9,#2563eb);box-shadow:0 0 25px rgba(109,40,217,.35);flex-shrink:0;overflow:hidden}
.g-icon.has-img{background:none;box-shadow:0 0 20px rgba(109,40,217,.4);border:1px solid rgba(139,92,255,.35)}
.g-icon img{width:100%;height:100%;object-fit:cover;display:block}
.g-name{font-size:18px;font-weight:800}
.g-status{font-size:12px;color:#7a7a99;margin-top:4px;display:flex;align-items:center;gap:5px}
.g-status::before{content:"";width:6px;height:6px;border-radius:50%;background:#00ff88;box-shadow:0 0 8px #00ff88}
.g-arrow{font-size:22px;color:#8b5cff;opacity:.6;transition:.3s;flex-shrink:0}
.g-card:hover .g-arrow{opacity:1;transform:translateX(5px)}
.games.view-compact .g-header{padding:12px 14px}
.games.view-compact .g-icon{width:38px;height:38px;font-size:18px;border-radius:9px}
