<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OMELES GAMES</title>
<style>

    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: 'Segoe UI', Arial, Helvetica, sans-serif;
    }

    :root {
        --purple: #8b5cff;
        --purple-dark: #6d28d9;
        --blue: #2563eb;
        --blue-light: #60a5fa;
        --bg: #05050a;
    }

    /* =========================
       FONDO ANIMADO
    ========================= */
    body {
        min-height: 100vh;
        background: var(--bg);
        color: white;
        overflow-x: hidden;
        position: relative;
    }

    /* Orbes de luz animados */
    .orb {
        position: fixed;
        border-radius: 50%;
        filter: blur(90px);
        opacity: 0.5;
        pointer-events: none;
        z-index: 0;
        animation: float 20s infinite ease-in-out;
    }

    .orb-1 {
        width: 400px;
        height: 400px;
        background: radial-gradient(circle, #8b5cff, transparent 70%);
        top: -100px;
        right: -100px;
        animation-delay: 0s;
    }

    .orb-2 {
        width: 500px;
        height: 500px;
        background: radial-gradient(circle, #2563eb, transparent 70%);
        bottom: -150px;
        left: -150px;
        animation-delay: -7s;
    }

    .orb-3 {
        width: 350px;
        height: 350px;
        background: radial-gradient(circle, #a855f7, transparent 70%);
        top: 40%;
        left: 45%;
        opacity: 0.25;
        animation-delay: -14s;
    }

    @keyframes float {
        0%, 100% { transform: translate(0, 0) scale(1); }
        33% { transform: translate(50px, -80px) scale(1.1); }
        66% { transform: translate(-50px, 50px) scale(0.9); }
    }

    /* Grid sutil encima del fondo */
    .grid-overlay {
        position: fixed;
        inset: 0;
        background-image:
            linear-gradient(rgba(139, 92, 255, 0.03) 1px, transparent 1px),
            linear-gradient(90deg, rgba(139, 92, 255, 0.03) 1px, transparent 1px);
        background-size: 50px 50px;
        pointer-events: none;
        z-index: 1;
    }

    /* Contenido encima */
    #loginScreen, #clientScreen, .modal-overlay {
        position: relative;
        z-index: 2;
    }

    /* =========================
       LOGIN
    ========================= */

    #loginScreen {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
    }

    .login-box {
        width: 100%;
        max-width: 440px;
        padding: 45px 40px;
        border-radius: 24px;
        background: linear-gradient(145deg, rgba(25,25,40,0.85), rgba(10,10,20,0.9));
        backdrop-filter: blur(20px);
        border: 1px solid rgba(139,92,255,0.25);
        box-shadow:
            0 30px 90px rgba(0,0,0,0.6),
            0 0 80px rgba(139,92,255,0.15),
            inset 0 1px 0 rgba(255,255,255,0.08);
        text-align: center;
        position: relative;
        animation: loginFadeIn 0.6s ease;
    }

    @keyframes loginFadeIn {
        from { opacity: 0; transform: translateY(20px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .login-box::before {
        content: "";
        position: absolute;
        inset: -2px;
        border-radius: 26px;
        background: linear-gradient(135deg, #8b5cff, #2563eb, #8b5cff);
        background-size: 200% 200%;
        animation: shine 4s linear infinite;
        z-index: -1;
        opacity: 0.4;
        filter: blur(12px);
    }

    @keyframes shine {
        0% { background-position: 0% 50%; }
        100% { background-position: 200% 50%; }
    }

    .login-logo {
        font-size: 34px;
        font-weight: 900;
        letter-spacing: 3px;
        margin-bottom: 10px;
        background: linear-gradient(90deg, #ffffff, #b99cff, #ffffff);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-size: 200% auto;
        animation: shine 3s linear infinite;
    }

    .login-logo span { color: #8b5cff; -webkit-text-fill-color: #8b5cff; }

    .login-subtitle {
        color: #888;
        font-size: 14px;
        margin-bottom: 35px;
        letter-spacing: 0.5px;
    }

    .key-input {
        width: 100%;
        padding: 16px;
        border-radius: 12px;
        border: 1px solid rgba(255,255,255,0.1);
        background: rgba(0,0,0,0.4);
        color: white;
        outline: none;
        text-align: center;
        font-size: 14px;
        letter-spacing: 1.5px;
        margin-bottom: 14px;
        transition: 0.3s;
    }

    .key-input::placeholder {
        color: #555;
        letter-spacing: 1px;
    }

    .key-input:focus {
        border-color: #8b5cff;
        box-shadow: 0 0 25px rgba(139,92,255,0.3), inset 0 0 20px rgba(139,92,255,0.05);
        background: rgba(0,0,0,0.55);
    }

    .login-button {
        width: 100%;
        padding: 15px;
        border: none;
        border-radius: 12px;
        background: linear-gradient(90deg, #6d28d9, #2563eb);
        background-size: 200% auto;
        color: white;
        font-weight: 900;
        letter-spacing: 2px;
        cursor: pointer;
        transition: 0.4s;
        box-shadow: 0 8px 25px rgba(109,40,217,0.4);
    }

    .login-button:hover {
        background-position: right center;
        transform: translateY(-2px);
        box-shadow: 0 12px 35px rgba(109,40,217,0.6);
    }

    #loginMessage {
        min-height: 20px;
        margin-top: 15px;
        font-size: 13px;
        color: #ff5c5c;
    }

    /* =========================
       CLIENTE
    ========================= */

    #clientScreen {
        display: none;
        min-height: 100vh;
    }

    header {
        height: 80px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 40px;
        border-bottom: 1px solid rgba(255,255,255,0.06);
        background: rgba(10,10,20,0.6);
        backdrop-filter: blur(20px);
        position: sticky;
        top: 0;
        z-index: 100;
    }

    .logo {
        font-size: 26px;
        font-weight: 900;
        letter-spacing: 2px;
    }

    .logo span { color: #8b5cff; }

    .header-right {
        display: flex;
        align-items: center;
        gap: 20px;
    }

    .status {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 13px;
        color: #aaa;
        padding: 6px 12px;
        border-radius: 20px;
        background: rgba(0,255,136,0.05);
        border: 1px solid rgba(0,255,136,0.15);
    }

    .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #00ff88;
        box-shadow: 0 0 10px #00ff88;
        animation: pulse 2s infinite;
    }

    @keyframes pulse {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.5; transform: scale(1.3); }
    }

    .logout {
        border: none;
        background: rgba(255,255,255,0.05);
        color: #aaa;
        padding: 8px 16px;
        border-radius: 10px;
        cursor: pointer;
        font-size: 12px;
        font-weight: bold;
        letter-spacing: 1px;
        transition: 0.2s;
    }

    .logout:hover {
        color: white;
        background: rgba(255,50,80,0.15);
        color: #ff5672;
    }

    main {
        max-width: 950px;
        margin: auto;
        padding: 60px 25px;
    }

    .hero {
        margin-bottom: 40px;
        text-align: center;
    }

    .hero h1 {
        font-size: 52px;
        font-weight: 900;
        margin-bottom: 12px;
        background: linear-gradient(90deg, #ffffff, #b99cff, #60a5fa, #ffffff);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-size: 300% auto;
        animation: shine 5s linear infinite;
    }

    .hero p {
        color: #888;
        font-size: 15px;
        letter-spacing: 0.5px;
    }

    /* =========================
       BUSCADOR
    ========================= */

    .search-wrapper {
        margin-bottom: 35px;
        position: relative;
    }

    .search-wrapper::before {
        content: "🔍";
        position: absolute;
        left: 20px;
        top: 50%;
        transform: translateY(-50%);
        font-size: 18px;
        opacity: 0.5;
        pointer-events: none;
    }

    .search-input {
        width: 100%;
        padding: 18px 20px 18px 55px;
        border-radius: 16px;
        border: 1px solid rgba(139,92,255,0.2);
        background: rgba(20,20,35,0.6);
        backdrop-filter: blur(10px);
        color: white;
        outline: none;
        font-size: 15px;
        transition: 0.3s;
    }

    .search-input::placeholder { color: #555; }

    .search-input:focus {
        border-color: #8b5cff;
        box-shadow: 0 0 30px rgba(139,92,255,0.25);
        background: rgba(20,20,35,0.8);
    }

    /* =========================
       TARJETAS DE JUEGO
    ========================= */

    .games {
        display: flex;
        flex-direction: column;
        gap: 16px;
    }

    .game-card {
        background: linear-gradient(145deg, rgba(25,25,40,0.7), rgba(12,12,22,0.85));
        backdrop-filter: blur(15px);
        border: 1px solid rgba(139,92,255,0.15);
        border-radius: 18px;
        overflow: hidden;
        cursor: pointer;
        transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
        position: relative;
    }

    .game-card::before {
        content: "";
        position: absolute;
        top: 0;
        left: -100%;
        width: 100%;
        height: 100%;
        background: linear-gradient(90deg, transparent, rgba(139,92,255,0.1), transparent);
        transition: 0.7s;
    }

    .game-card:hover::before {
        left: 100%;
    }

    .game-card:hover {
        border-color: rgba(139,92,255,0.5);
        transform: translateY(-4px);
        box-shadow:
            0 20px 50px rgba(0,0,0,0.4),
            0 0 40px rgba(139,92,255,0.15);
    }

    .game-header {
        width: 100%;
        padding: 22px 25px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        background: transparent;
        color: white;
        border: none;
        cursor: pointer;
        text-align: left;
    }

    .game-left {
        display: flex;
        align-items: center;
        gap: 18px;
    }

    .game-icon {
        width: 60px;
        height: 60px;
        border-radius: 14px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 26px;
        background: linear-gradient(135deg, #6d28d9, #2563eb);
        box-shadow:
            0 0 25px rgba(109,40,217,0.35),
            inset 0 1px 0 rgba(255,255,255,0.15);
        flex-shrink: 0;
        overflow: hidden;
        position: relative;
    }

    .game-icon::after {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(135deg, rgba(255,255,255,0.2), transparent 50%);
        opacity: 0.5;
    }

    .game-icon.has-image {
        background: none;
        box-shadow: 0 0 20px rgba(109,40,217,0.4);
        border: 1px solid rgba(139,92,255,0.35);
    }

    .game-icon.has-image::after { display: none; }

    .game-icon img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
    }

    .game-name {
        font-size: 19px;
        font-weight: 800;
        letter-spacing: 0.3px;
    }

    .game-status {
        font-size: 12px;
        color: #7a7a99;
        margin-top: 5px;
        display: flex;
        align-items: center;
        gap: 5px;
    }

    .game-status::before {
        content: "";
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: #00ff88;
        box-shadow: 0 0 8px #00ff88;
    }

    .game-arrow {
        font-size: 22px;
        color: #8b5cff;
        transition: 0.3s;
        opacity: 0.6;
    }

    .game-card:hover .game-arrow {
        opacity: 1;
        transform: translateX(5px);
    }

    .empty {
        padding: 60px 40px;
        text-align: center;
        color: #666;
        border: 2px dashed rgba(139,92,255,0.15);
        border-radius: 20px;
        background: rgba(20,20,35,0.3);
        backdrop-filter: blur(10px);
    }

    footer {
        text-align: center;
        padding: 40px;
        color: #444;
        font-size: 12px;
        letter-spacing: 1px;
    }

    /* =========================
       MODAL DE JUEGO
    ========================= */

    .game-modal {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.85);
        backdrop-filter: blur(12px);
        z-index: 1000;
        align-items: center;
        justify-content: center;
        padding: 20px;
        overflow-y: auto;
    }

    .game-modal.open {
        display: flex;
        animation: modalFade 0.3s ease;
    }

    @keyframes modalFade {
        from { opacity: 0; }
        to { opacity: 1; }
    }

    .game-modal-box {
        width: 100%;
        max-width: 520px;
        background: linear-gradient(160deg, rgba(28,28,45,0.98), rgba(15,15,28,0.98));
        border-radius: 24px;
        overflow: hidden;
        position: relative;
        box-shadow:
            0 30px 100px rgba(0,0,0,0.8),
            0 0 80px rgba(139,92,255,0.25);
        animation: modalSlide 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        border: 1px solid rgba(139,92,255,0.3);
    }

    @keyframes modalSlide {
        from { opacity: 0; transform: translateY(40px) scale(0.95); }
        to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .game-modal-banner {
        width: 100%;
        height: 180px;
        background: linear-gradient(135deg, #6d28d9, #2563eb);
        position: relative;
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .game-modal-banner img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
    }

    .game-modal-banner .banner-fallback {
        font-size: 70px;
        filter: drop-shadow(0 0 20px rgba(255,255,255,0.4));
    }

    .game-modal-banner::after {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(to bottom, transparent 40%, rgba(15,15,28,0.98) 100%);
        pointer-events: none;
    }

    .game-modal-close {
        position: absolute;
        top: 15px;
        right: 15px;
        width: 38px;
        height: 38px;
        border-radius: 50%;
        background: rgba(0,0,0,0.6);
        backdrop-filter: blur(10px);
        border: 1px solid rgba(255,255,255,0.15);
        color: white;
        font-size: 18px;
        cursor: pointer;
        transition: 0.2s;
        z-index: 3;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .game-modal-close:hover {
        background: rgba(255,50,80,0.3);
        border-color: rgba(255,50,80,0.5);
        transform: rotate(90deg);
    }

    .game-modal-body {
        padding: 25px 30px 30px;
        position: relative;
        z-index: 2;
    }

    .game-modal-title {
        font-size: 26px;
        font-weight: 900;
        margin-bottom: 8px;
        background: linear-gradient(90deg, #ffffff, #b99cff);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
    }

    .game-modal-info {
        color: #7a7a99;
        font-size: 13px;
        margin-bottom: 25px;
        display: flex;
        align-items: center;
        gap: 6px;
    }

    .game-modal-info::before {
        content: "";
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #00ff88;
        box-shadow: 0 0 8px #00ff88;
    }

    .game-modal-buttons {
        display: flex;
        flex-direction: column;
        gap: 12px;
    }

    .game-btn {
        display: flex;
        align-items: center;
        gap: 15px;
        padding: 16px 20px;
        border-radius: 14px;
        border: none;
        color: white;
        font-weight: bold;
        font-size: 15px;
        cursor: pointer;
        transition: all 0.3s;
        text-decoration: none;
        position: relative;
        overflow: hidden;
    }

    .game-btn-icon {
        font-size: 22px;
        width: 40px;
        height: 40px;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 10px;
        background: rgba(0,0,0,0.25);
        flex-shrink: 0;
    }

    .game-btn-text {
        display: flex;
        flex-direction: column;
        gap: 2px;
    }

    .game-btn-title {
        font-size: 15px;
        font-weight: 800;
        letter-spacing: 0.5px;
    }

    .game-btn-subtitle {
        font-size: 11px;
        opacity: 0.7;
        font-weight: normal;
    }

    .game-btn.download {
        background: linear-gradient(135deg, #6d28d9, #2563eb);
        box-shadow: 0 8px 25px rgba(109,40,217,0.35);
    }

    .game-btn.download:hover {
        transform: translateY(-2px);
        box-shadow: 0 12px 35px rgba(109,40,217,0.55);
    }

    .game-btn.repair {
        background: linear-gradient(135deg, #0e7490, #0891b2);
        box-shadow: 0 8px 25px rgba(14,116,144,0.3);
    }

    .game-btn.repair:hover {
        transform: translateY(-2px);
        box-shadow: 0 12px 35px rgba(14,116,144,0.5);
    }

    .game-btn.password {
        background: linear-gradient(135deg, #7c3aed, #a855f7);
        box-shadow: 0 8px 25px rgba(124,58,237,0.3);
    }

    .game-btn.password:hover {
        transform: translateY(-2px);
        box-shadow: 0 12px 35px rgba(124,58,237,0.5);
    }

    .game-btn.shine::before {
        content: "";
        position: absolute;
        top: 0;
        left: -100%;
        width: 100%;
        height: 100%;
        background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
        transition: 0.6s;
    }

    .game-btn:hover::before {
        left: 100%;
    }

    /* Toast de copiado */
    #copyToast {
        position: fixed;
        bottom: 40px;
        left: 50%;
        transform: translateX(-50%) translateY(100px);
        background: linear-gradient(135deg, #6d28d9, #2563eb);
        color: white;
        padding: 16px 28px;
        border-radius: 14px;
        font-weight: bold;
        font-size: 14px;
        box-shadow: 0 15px 50px rgba(109,40,217,0.5);
        opacity: 0;
        transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        z-index: 2000;
        display: flex;
        align-items: center;
        gap: 10px;
    }

    #copyToast.show {
        opacity: 1;
        transform: translateX(-50%) translateY(0);
    }

    @media (max-width: 600px) {
        header { padding: 0 20px; }
        .header-right { gap: 10px; }
        .status { display: none; }
        .hero h1 { font-size: 34px; }
        main { padding: 40px 18px; }
        .login-box { padding: 32px 24px; }
        .game-modal-title { font-size: 22px; }
        .game-icon { width: 52px; height: 52px; font-size: 22px; }
        .game-modal-banner { height: 140px; }
    }

</style>
</head>

<body>

<!-- FONDO ANIMADO -->
<div class="orb orb-1"></div>
<div class="orb orb-2"></div>
<div class="orb orb-3"></div>
<div class="grid-overlay"></div>

<!-- LOGIN -->
<div id="loginScreen">
    <div class="login-box">
        <div class="login-logo">OMELES <span>GAMES</span></div>
        <div class="login-subtitle">Introduce tu KEY para continuar</div>
        <input id="keyInput" class="key-input" type="text" placeholder="OMELES-XXXXXX-XXXXXX" autocomplete="off">
        <button class="login-button" onclick="iniciarSesion()">ENTRAR</button>
        <div id="loginMessage"></div>
    </div>
</div>

<!-- CLIENTE -->
<div id="clientScreen">
    <header>
        <div class="logo">OMELES <span>GAMES</span></div>
        <div class="header-right">
            <div class="status">
                <div class="dot"></div>
                ONLINE
            </div>
            <button class="logout" onclick="cerrarSesion()">SALIR</button>
        </div>
    </header>

    <main>
        <section class="hero">
            <h1>Tus juegos</h1>
            <p>Selecciona un juego para ver sus opciones</p>
        </section>

        <div class="search-wrapper">
            <input
                id="searchInput"
                class="search-input"
                type="text"
                placeholder="Buscar juego..."
                autocomplete="off"
                oninput="filtrarJuegos()"
            >
        </div>

        <section id="games" class="games">
            <div class="empty">Cargando juegos...</div>
        </section>
    </main>

    <footer>OMELES GAMES © 2026</footer>
</div>

<!-- MODAL DE JUEGO -->
<div id="gameModal" class="game-modal">
    <div class="game-modal-box">
        <button class="game-modal-close" onclick="cerrarModal()">✕</button>

        <div class="game-modal-banner" id="modalBanner">
            <div class="banner-fallback">🎮</div>
        </div>

        <div class="game-modal-body">
            <h2 class="game-modal-title" id="modalTitle">Nombre</h2>
            <div class="game-modal-info">Juego disponible</div>

            <div class="game-modal-buttons" id="modalButtons"></div>
        </div>
    </div>
</div>

<!-- TOAST DE COPIADO -->
<div id="copyToast">✅ Contraseña copiada</div>

<script src="/socket.io/socket.io.js"></script>

<script>
const SERVER_URL = window.location.origin;

let todosLosJuegos = [];
let socket = null;
let currentKey = "";
let juegoActual = null;

/* =========================
   LOGIN
========================= */

async function iniciarSesion() {
    const input = document.getElementById("keyInput");
    const message = document.getElementById("loginMessage");
    const key = input.value.trim();

    if (!key) {
        message.textContent = "Introduce una KEY.";
        return;
    }

    message.textContent = "Comprobando KEY...";

    try {
        const respuesta = await fetch(`${SERVER_URL}/api/login`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ key: key })
        });

        const datos = await respuesta.json();

        if (!respuesta.ok) {
            message.textContent = datos.message || datos.error || "KEY incorrecta.";
            return;
        }

        localStorage.setItem("omeles_key", key);
        currentKey = key;
        mostrarCliente();
        conectarSocket();

    } catch (error) {
        console.error(error);
        message.textContent = "No se pudo conectar con el servidor.";
    }
}

/* =========================
   SOCKET.IO
========================= */

function conectarSocket() {
    if (socket) {
        socket.disconnect();
        socket = null;
    }

    socket = io({ auth: { key: currentKey } });

    socket.on("connect", () => {
        console.log("✅ Socket cliente conectado");
    });

    socket.on("key-revoked", (data) => {
        if (data.key === currentKey) {
            alert("⚠️ Tu KEY ha sido revocada o eliminada.\n\nSerás expulsado.");
            cerrarSesion();
        }
    });

    socket.on("games-updated", () => {
        cargarJuegos();
    });
}

/* =========================
   MOSTRAR CLIENTE
========================= */

function mostrarCliente() {
    document.getElementById("loginScreen").style.display = "none";
    document.getElementById("clientScreen").style.display = "block";
    cargarJuegos();
}

function cerrarSesion() {
    localStorage.removeItem("omeles_key");
    currentKey = "";

    if (socket) {
        socket.disconnect();
        socket = null;
    }

    document.getElementById("clientScreen").style.display = "none";
    document.getElementById("loginScreen").style.display = "flex";
    document.getElementById("keyInput").value = "";
    document.getElementById("loginMessage").textContent = "";
}

/* =========================
   ESCAPAR HTML
========================= */

function escapeHTML(valor) {
    return String(valor ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}

/* =========================
   CARGAR JUEGOS
========================= */

async function cargarJuegos() {
    const contenedor = document.getElementById("games");
    contenedor.innerHTML = `<div class="empty">Cargando juegos...</div>`;

    try {
        const respuesta = await fetch(`${SERVER_URL}/api/games`);

        if (!respuesta.ok) throw new Error("Error al cargar juegos");

        const datos = await respuesta.json();

        if (!datos.success) throw new Error(datos.message || "Error obteniendo los juegos");

        todosLosJuegos = Array.isArray(datos.games) ? datos.games : [];
        filtrarJuegos();

    } catch (error) {
        console.error("ERROR CARGANDO JUEGOS:", error);
        contenedor.innerHTML = `
            <div class="empty">
                No se pudieron cargar los juegos.
                <br><br>
                <span style="font-size:11px;color:#555;">
                    ${escapeHTML(error.message)}
                </span>
            </div>
        `;
    }
}

/* =========================
   FILTRAR JUEGOS
========================= */

function filtrarJuegos() {
    const input = document.getElementById("searchInput");
    const texto = input ? input.value.toLowerCase().trim() : "";

    let filtrados = todosLosJuegos;

    if (texto) {
        filtrados = todosLosJuegos.filter(juego =>
            String(juego.name || "").toLowerCase().includes(texto)
        );
    }

    renderJuegos(filtrados);
}

/* =========================
   RENDER TARJETAS
========================= */

function renderJuegos(juegos) {
    const contenedor = document.getElementById("games");
    contenedor.innerHTML = "";

    if (!juegos || juegos.length === 0) {
        const texto = document.getElementById("searchInput")?.value.trim();
        contenedor.innerHTML = `
            <div class="empty">
                ${texto ? "No se encontraron juegos con ese nombre." : "No hay juegos disponibles todavía."}
            </div>
        `;
        return;
    }

    juegos.forEach(juego => {
        const tarjeta = document.createElement("div");
        tarjeta.className = "game-card";

        const nombre = escapeHTML(juego.name);
        const imagen = escapeHTML(juego.image || "");

        const iconoHTML = imagen
            ? `<div class="game-icon has-image"><img src="${imagen}" alt="${nombre}" loading="lazy" onerror="this.parentElement.classList.remove('has-image'); this.parentElement.innerHTML='🎮';"></div>`
            : `<div class="game-icon">🎮</div>`;

        tarjeta.innerHTML = `
            <button class="game-header" type="button">
                <div class="game-left">
                    ${iconoHTML}
                    <div>
                        <div class="game-name">${nombre}</div>
                        <div class="game-status">Juego disponible</div>
                    </div>
                </div>
                <div class="game-arrow">›</div>
            </button>
        `;

        tarjeta.addEventListener("click", () => abrirModal(juego));

        contenedor.appendChild(tarjeta);
    });
}

/* =========================
   MODAL DE JUEGO
========================= */

function abrirModal(juego) {
    juegoActual = juego;

    // Banner con imagen
    const banner = document.getElementById("modalBanner");
    if (juego.image) {
        banner.innerHTML = `<img src="${escapeHTML(juego.image)}" alt="" onerror="this.parentElement.innerHTML='<div class=\\'banner-fallback\\'>🎮</div>';"><button class="game-modal-close" onclick="cerrarModal()">✕</button>`;
        // Re-add close button on top
        const closeBtn = document.querySelector(".game-modal-close");
        if (closeBtn) closeBtn.remove();
        banner.insertAdjacentHTML("afterbegin", "");
    } else {
        banner.innerHTML = `<div class="banner-fallback">🎮</div>`;
    }

    // Recolocar el botón cerrar (siempre visible)
    const box = document.querySelector(".game-modal-box");
    let oldClose = box.querySelector(".game-modal-close");
    if (oldClose) oldClose.remove();
    box.insertAdjacentHTML("afterbegin", `<button class="game-modal-close" onclick="cerrarModal()">✕</button>`);

    // Título
    document.getElementById("modalTitle").textContent = juego.name || "Juego";

    // Botones
    const contenedorBotones = document.getElementById("modalButtons");
    contenedorBotones.innerHTML = "";

    const download = juego.download ? String(juego.download).trim() : "";
    const repair = juego.repair ? String(juego.repair).trim() : "";
    const password = juego.password ? String(juego.password) : "";

    if (download) {
        const a = document.createElement("a");
        a.href = download;
        a.target = "_blank";
        a.rel = "noopener noreferrer";
        a.className = "game-btn download shine";
        a.innerHTML = `
            <div class="game-btn-icon">⬇️</div>
            <div class="game-btn-text">
                <span class="game-btn-title">DESCARGAR</span>
                <span class="game-btn-subtitle">Obtener el juego completo</span>
            </div>
        `;
        contenedorBotones.appendChild(a);
    }

    if (repair) {
        const a = document.createElement("a");
        a.href = repair;
        a.target = "_blank";
        a.rel = "noopener noreferrer";
        a.className = "game-btn repair shine";
        a.innerHTML = `
            <div class="game-btn-icon">🔧</div>
            <div class="game-btn-text">
                <span class="game-btn-title">REPARACIÓN</span>
                <span class="game-btn-subtitle">Solucionar errores del juego</span>
            </div>
        `;
        contenedorBotones.appendChild(a);
    }

    if (password) {
        const btn = document.createElement("button");
        btn.className = "game-btn password shine";
        btn.innerHTML = `
            <div class="game-btn-icon">🔑</div>
            <div class="game-btn-text">
                <span class="game-btn-title">CONTRASEÑA</span>
                <span class="game-btn-subtitle">Copiar al portapapeles</span>
            </div>
        `;
        btn.addEventListener("click", () => copiarPassword(password));
        contenedorBotones.appendChild(btn);
    }

    if (!download && !repair && !password) {
        contenedorBotones.innerHTML = `
            <div style="text-align:center;color:#666;padding:20px;font-size:13px;">
                Este juego no tiene opciones disponibles todavía.
            </div>
        `;
    }

    document.getElementById("gameModal").classList.add("open");
    document.body.style.overflow = "hidden";
}

function cerrarModal() {
    document.getElementById("gameModal").classList.remove("open");
    document.body.style.overflow = "";
    juegoActual = null;
}

/* Cerrar con ESC o clic fuera */
document.getElementById("gameModal").addEventListener("click", (e) => {
    if (e.target.id === "gameModal") cerrarModal();
});
document.addEventListener("keydown", (e) => {
    if (e.key === "Escape" && document.getElementById("gameModal").classList.contains("open")) {
        cerrarModal();
    }
});

/* =========================
   COPIAR PASSWORD
========================= */

async function copiarPassword(password) {
    try {
        await navigator.clipboard.writeText(password);
    } catch {
        const ta = document.createElement("textarea");
        ta.value = password;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand("copy");
        document.body.removeChild(ta);
    }

    const toast = document.getElementById("copyToast");
    toast.classList.add("show");
    setTimeout(() => toast.classList.remove("show"), 2200);
}

/* =========================
   ENTER LOGIN
========================= */

document.getElementById("keyInput").addEventListener("keydown", function(event) {
    if (event.key === "Enter") iniciarSesion();
});

/* =========================
   RECUPERAR SESIÓN
========================= */

window.addEventListener("DOMContentLoaded", () => {
    const key = localStorage.getItem("omeles_key");

    if (key) {
        fetch("/api/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ key: key })
        })
        .then(async respuesta => {
            if (!respuesta.ok) {
                localStorage.removeItem("omeles_key");
                return;
            }
            currentKey = key;
            mostrarCliente();
            conectarSocket();
        })
        .catch(error => {
            console.error("ERROR RECUPERANDO SESIÓN:", error);
        });
    }
});

</script>
